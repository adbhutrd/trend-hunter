[project]
name = "trend-hunter"
version = "0.1.0"
description = "Self-hosted Shopify trend-finder, B2B lead-generator, and arbitrage engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "anonwiz" }]
keywords = ["shopping", "trends", "leads", "arbitrage", "dropshipping", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "duckdb>=0.10.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "streamlit>=1.36.0",
    "streamlit-aggrid>=0.3.4",
    "streamlit-autorefresh>=1.0.0",
    "plotly>=5.18.0",
    "APScheduler>=3.10.0",
    "aiosmtplib>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-requests",
]

[project.scripts]
trend-hunter = "trend_hunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trend_hunter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.coverage.run]
# `branch = true` enables branch coverage so short-circuited if/else arms
# show up in the report even when the whole `if` line is hit.
branch = true
source = ["trend_hunter"]
# `__main__.py` is invocation glue — no testable surface. Skipping it so
# the bar reflects testable library code, not entry-point boilerplate.
omit = ["trend_hunter/__main__.py"]

[tool.coverage.report]
# Don't omit fully-covered files from the report — every untested line is
# a real gap, not a tooling artifact. `exclude_lines` lists common
# patterns where coverage.py should not flag a line as missing.
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "raise NotImplementedError",
]
sort = "Cover"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    # Coverage is enabled by default for `pytest`; CI gets the same view.
    # Floor of 30% sits 3.46pp below the actual measured branch-coverage
    # baseline (33.46%):
    #   - ≈35% line-only baseline (before branch coverage was enabled)
    #   - 33.46% branch-coverage baseline (with [tool.coverage.run]
    #     branch = true — typical 2-15pp drop from enabling branch
    #     coverage; a small swing is expected and acceptable)
    # Ratchet up over time as test-coverage of cli/flows/scripts/UI
    # improves.
    "--cov=trend_hunter",
    "--cov-report=term-missing",
    "--cov-fail-under=30",
]
